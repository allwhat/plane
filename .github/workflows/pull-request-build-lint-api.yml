name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
      - ".github/workflows/pull-request-build-lint-api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint-api:
    name: Lint API
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.requested_reviewers != null)
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements/*.txt'
      - name: Set up my CI to install from PackageMaze
        id: packagemaze-token
        uses: packagemaze/setup-maze@v0.0.5
        with:
          feed: packagemaze/demo-pypi
          purpose: install
      - name: Install API dependencies and tooling
        env:
          PIP_INDEX_URL: https://__token__:${{ steps.packagemaze-token.outputs.token }}@pkg.packagemaze.com/packagemaze/demo-pypi/simple/
        run: |
          python -m pip install -r apps/api/requirements/local.txt -r apps/api/requirements/production.txt -r apps/api/requirements/test.txt
          python -m pip check
      - name: Compile API
        run: python -m compileall -q apps/api/plane
      - name: Lint apps/api
        run: ruff check apps/api
