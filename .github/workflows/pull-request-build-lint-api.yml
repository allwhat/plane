name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint-api:
    name: Lint API
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'
      - name: Set up my CI to install from PackageMaze
        id: packagemaze-token
        uses: packagemaze/setup-maze@v0.0.2
        with:
          feed: packagemaze/pypi-smoke-test
          purpose: install
      - name: Install Pylint
        env:
          PIP_INDEX_URL: https://__token__:${{ steps.packagemaze-token.outputs.token }}@pkg.packagemaze.com/packagemaze/pypi-smoke-test/simple/
        run: python -m pip install ruff
      - name: Install API Dependencies
        env:
          PIP_INDEX_URL: https://__token__:${{ steps.packagemaze-token.outputs.token }}@pkg.packagemaze.com/packagemaze/pypi-smoke-test/simple/
        run: cd apps/api && pip install -r requirements.txt
      - name: Lint apps/api
        run: ruff check --fix apps/api

  install-benchmark-packagemaze-cold:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: Benchmark PyPI install with PackageMaze (cold)
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
      - name: Set up PackageMaze for PyPI installs
        id: packagemaze-token
        uses: packagemaze/setup-maze@v0.0.2
        with:
          feed: packagemaze/pypi-smoke-test
          purpose: install
      - name: Install API dependencies with PackageMaze
        env:
          PIP_INDEX_URL: https://__token__:${{ steps.packagemaze-token.outputs.token }}@pkg.packagemaze.com/packagemaze/pypi-smoke-test/simple/
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          python -m pip install ruff
          cd apps/api
          pip install -r requirements.txt
          end_ms="$(date +%s%3N)"
          elapsed_ms="$((end_ms - start_ms))"
          printf 'BENCHMARK_RESULT repo=plane protocol=pypi scenario=packagemaze-cold milliseconds=%s seconds=%s.%03d\n' "$elapsed_ms" "$((elapsed_ms / 1000))" "$((elapsed_ms % 1000))"

  install-benchmark-packagemaze-warm:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: install-benchmark-packagemaze-cold
    runs-on: ubuntu-latest
    name: Benchmark PyPI install with PackageMaze (warm)
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
      - name: Set up PackageMaze for PyPI installs
        id: packagemaze-token
        uses: packagemaze/setup-maze@v0.0.2
        with:
          feed: packagemaze/pypi-smoke-test
          purpose: install
      - name: Install API dependencies with PackageMaze
        env:
          PIP_INDEX_URL: https://__token__:${{ steps.packagemaze-token.outputs.token }}@pkg.packagemaze.com/packagemaze/pypi-smoke-test/simple/
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          python -m pip install ruff
          cd apps/api
          pip install -r requirements.txt
          end_ms="$(date +%s%3N)"
          elapsed_ms="$((end_ms - start_ms))"
          printf 'BENCHMARK_RESULT repo=plane protocol=pypi scenario=packagemaze-warm milliseconds=%s seconds=%s.%03d\n' "$elapsed_ms" "$((elapsed_ms / 1000))" "$((elapsed_ms % 1000))"

  install-benchmark-upstream:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: Benchmark PyPI install from upstream
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
      - name: Install API dependencies from upstream
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          python -m pip install ruff
          cd apps/api
          pip install -r requirements.txt
          end_ms="$(date +%s%3N)"
          elapsed_ms="$((end_ms - start_ms))"
          printf 'BENCHMARK_RESULT repo=plane protocol=pypi scenario=upstream milliseconds=%s seconds=%s.%03d\n' "$elapsed_ms" "$((elapsed_ms / 1000))" "$((elapsed_ms % 1000))"
