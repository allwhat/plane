name: PackageMaze Docker build rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/packagemaze-docker-build-rehearsal.yml"
      - "apps/**/Dockerfile*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  docker-builds:
    name: Build ${{ matrix.name }} with PackageMaze
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: ./apps/web/Dockerfile.web
            feed: packagemaze/demo-npm
          - name: api
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
            feed: packagemaze/demo-pypi
    steps:
      - uses: actions/checkout@v6
      - id: maze
        uses: packagemaze/setup-maze@v0.0.5
        with:
          feed: ${{ matrix.feed }}
          purpose: docker-build
      - name: Set up Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          secret-files: ${{ steps.maze.outputs.secret_files }}
      - name: Remove BuildKit credentials
        if: always() && steps.maze.outputs.secret_path != ''
        env:
          MAZE_SECRET_PATH: ${{ steps.maze.outputs.secret_path }}
        run: rm -f -- "$MAZE_SECRET_PATH"
